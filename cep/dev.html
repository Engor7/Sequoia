<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sequoia Dev</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #1d1d1d;
        color: #d0d0d0;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        display: grid;
        gap: 12px;
        justify-items: center;
      }

      p {
        max-width: 280px;
        margin: 0;
        color: #b0b0b0;
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
      }

      code {
        color: #ebebeb;
      }
    </style>
    <script>
      const devUrl = 'http://127.0.0.1:5173/'
      const retryDelay = 1000

      function connect() {
        fetch(devUrl, { mode: 'no-cors', cache: 'no-store' })
          .then(() => {
            window.location.replace(devUrl + '?cep=' + Date.now())
          })
          .catch(() => {
            window.setTimeout(connect, retryDelay)
          })
      }

      window.addEventListener('DOMContentLoaded', () => {
        document.body.innerHTML =
          '<main><p>Waiting for Sequoia dev server at <code>127.0.0.1:5173</code>.</p><p>Start it with <code>npm run dev</code>; this panel will connect automatically.</p></main>'
        connect()
      })
    </script>
  </head>
  <body>
    <main>
      <p>Connecting to Sequoia dev server...</p>
    </main>
  </body>
</html>
